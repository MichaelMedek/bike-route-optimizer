# Tooling config ONLY. Dependencies live in requirements.txt (single source of
# truth); packaging/metadata lives in setup.py. This mirrors the sibling
# ski-resort-designer layout (ruff + mypy, slightly lighter here).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bike_router --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["scripts/*", "main.py"]

[tool.coverage.report]
# Lines that only run under __main__ or defensive-unreachable branches.
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py311"
exclude = ["setup.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
# D (pydocstyle) E/F (pycodestyle/pyflakes) plus structural rules:
#   ANN flake8-annotations, C90 mccabe, PLR pylint-refactor, FBT boolean-trap,
#   B bugbear, SIM simplify, UP pyupgrade, I isort.
select = ["D", "E4", "E7", "E9", "F", "I", "ANN", "C90", "PLR", "FBT", "B", "SIM", "UP"]
ignore = [
    "D417", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D415",
    "E731", "E741",
    "PLR2004",  # magic-value-comparison: too noisy
    "PLR0911",  # too-many-return-statements
    "PLR0913",  # too-many-arguments: coordinate/config-heavy signatures
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are linted (F-rules catch real bugs) but not held to annotations/complexity.
"tests/*" = ["ANN", "PLR09", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Third-party libraries without type stubs — silence only *missing imports*.
[[tool.mypy.overrides]]
module = [
    "geopy.*",
    "rasterio.*",
    "gpxpy.*",
    "networkx.*",
    "matplotlib.*",
    "osmnx.*",
    "pyproj.*",
    "shapely.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

# Tests: type-correct but not forced to annotate every fixture/def.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
